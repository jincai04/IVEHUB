<!doctype html><html><head><meta charset="utf-8"><title>IVEHUB</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="config.js"></script>
<script src="gdrive.js"></script>
<style>
 *{box-sizing:border-box}
 :root{--acc:#38bdf8;--accbg:rgba(56,189,248,.12);--accbrd:rgba(56,189,248,.4)}
 body{font-family:'Segoe UI',system-ui,sans-serif;background:#070b14;color:#e8edf5;margin:0;min-height:100vh}
 .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
 .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:drift 22s ease-in-out infinite alternate}
 .orb.a{width:520px;height:520px;background:#0ea5e9;top:-160px;left:-120px}
 .orb.b{width:460px;height:460px;background:#6366f1;bottom:-140px;right:-100px;animation-delay:-7s}
 .orb.c{width:340px;height:340px;background:#10b981;top:40%;left:55%;animation-delay:-14s;opacity:.18}
 @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,70px) scale(.95)}}
 .glass{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);border-radius:16px}
 /* ---------- layout ---------- */
 .sidebar{position:fixed;top:0;left:0;bottom:0;width:236px;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(10,16,30,.92),rgba(7,11,20,.96));backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.08);transition:transform .3s cubic-bezier(.22,1,.36,1)}
 .brandrow{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
 .logo{width:44px;height:44px;border-radius:13px;overflow:hidden;flex:none;border:1.5px solid rgba(125,211,252,.6);box-shadow:0 8px 24px rgba(14,165,233,.35)}
 .logo img{width:100%;height:100%;object-fit:cover}
 .brandname{font-weight:800;letter-spacing:2px;font-size:1.05rem;background:linear-gradient(90deg,#7dd3fc,#a5b4fc,#6ee7b7,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
 @keyframes shine{to{background-position:300% 0}}
 .nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
 .nav::-webkit-scrollbar{width:4px}.nav::-webkit-scrollbar-thumb{background:rgba(125,211,252,.25);border-radius:4px}
 .navsec{margin-top:12px}
 .navsec>a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:#c7d4e4;font-weight:700;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none}
 .navsub a{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 26px;margin:1px 0;border-radius:9px;color:#8aa0b8;font-size:.8rem;text-decoration:none;transition:all .2s;border-left:2px solid transparent}
 .navsub a:hover{color:#c7d4e4;background:rgba(255,255,255,.04)}
 .navsub a.active{color:var(--acc);background:var(--accbg);border-left-color:var(--acc)}
 .sidefoot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
 .drivebtn{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#c7d4e4;padding:9px 10px;border-radius:11px;font-size:.72rem;letter-spacing:.5px;cursor:pointer;transition:all .25s}
 .drivebtn:hover{border-color:rgba(125,211,252,.4);color:#7dd3fc}
 .drivebtn.on{border-color:rgba(74,222,128,.4);color:#4ade80}
 .drivebtn .dot{width:7px;height:7px;border-radius:50%;background:#5b7189;flex:none}
 .drivebtn.on .dot{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.8)}
 .drivemeta{color:#5b7189;font-size:.62rem;text-align:center;margin-top:6px}
 .main{position:relative;z-index:1;margin-left:236px;min-height:100vh;padding:26px 30px 60px;max-width:1200px}
 .topbar{position:fixed;top:16px;right:22px;z-index:15;display:flex;gap:10px}
 .btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c7d4e4;padding:8px 16px;border-radius:12px;font-size:.75rem;letter-spacing:1px;cursor:pointer;text-decoration:none;transition:all .25s;display:inline-block}
 .btn:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#f87171}
 .burger{display:none;position:fixed;top:14px;left:14px;z-index:30;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c7d4e4;width:40px;height:40px;border-radius:12px;font-size:1rem;cursor:pointer}
 .scrim{display:none;position:fixed;inset:0;z-index:19;background:rgba(4,8,18,.6);backdrop-filter:blur(4px)}
 /* ---------- page furniture ---------- */
 .ph{margin-bottom:20px;animation:fadeUp .5s ease both}
 .ph h1{font-size:1.45rem;font-weight:800;letter-spacing:1px;margin:0}
 .ph .sub{color:#8aa0b8;font-size:.8rem;margin-top:4px}
 .tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
 .search{flex:1;min-width:180px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#e8edf5;padding:9px 14px;border-radius:12px;font-size:.85rem;outline:none;font-family:inherit}
 .search:focus{border-color:var(--accbrd)}
 .addbtn{background:var(--accbg);border:1px solid var(--accbrd);color:var(--acc);padding:9px 16px;border-radius:12px;font-size:.78rem;letter-spacing:1px;cursor:pointer;transition:all .25s;display:inline-block}
 .addbtn:hover{filter:brightness(1.5)}
 /* ---------- cards / grids ---------- */
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
 .acard{display:flex;align-items:center;gap:12px;padding:15px 16px;transition:transform .25s,border-color .25s;animation:fadeUp .5s ease both}
 .acard:hover{transform:translateY(-3px);border-color:rgba(125,211,252,.4)}
 .applink{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;flex:1;min-width:0}
 .ico{font-size:1.5rem;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
 .txt{flex:1;min-width:0}
 .nm{display:block;font-weight:650;font-size:.93rem;color:#eef4fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .desc{display:block;color:#8aa0b8;font-size:.74rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .acts{display:flex;gap:4px;flex:none}
 .abtn{background:none;border:none;color:#5b7189;font-size:.9rem;cursor:pointer;padding:4px 5px;border-radius:8px;transition:all .2s}
 .abtn:hover{background:rgba(255,255,255,.07);color:#c7d4e4}
 .abtn.fav.on{color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,.5)}
 .abtn.del:hover{color:#f87171}
 .empty{color:#5b7189;font-size:.85rem;padding:40px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:16px}
 /* ---------- item cards (projects / brain) ---------- */
 .icard{padding:16px 18px;animation:fadeUp .5s ease both}
 .icard .nm{font-weight:650;font-size:.95rem;color:#eef4fb}
 .bodyprev{color:#8aa0b8;font-size:.78rem;margin-top:6px;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
 .tagchip{display:inline-block;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;padding:1px 9px;border-radius:99px;font-size:.62rem;margin:8px 4px 0 0}
 .stchip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.6rem;letter-spacing:1px;flex:none}
 .stchip.active{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);color:#7dd3fc}
 .stchip.done{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);color:#4ade80}
 .icard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
 .icard-meta{color:#5b7189;font-size:.68rem;margin-top:8px}
 .acts2{display:flex;gap:4px;margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px}
 .hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:8px;animation:fadeUp .4s ease both}
 .hrow .when{color:#5b7189;font-size:.7rem;flex:none;width:72px}
 .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
 .stat{padding:16px 22px;text-align:center;flex:1;min-width:120px}
 .stat .n{font-size:1.7rem;font-weight:800;color:var(--acc)}
 .swflex{display:flex;gap:14px;flex-wrap:wrap}
 .sw{width:42px;height:42px;border-radius:13px;border:2px solid rgba(255,255,255,.15);cursor:pointer;color:#070b14;font-size:1.05rem;font-weight:800;transition:transform .2s,box-shadow .2s}
 .sw:hover{transform:scale(1.12)}
 .sw.on{border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.3)}
 .tgl{width:48px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);cursor:pointer;position:relative;transition:all .25s;flex:none;padding:0}
 .tgl span{position:absolute;top:2px;left:3px;width:19px;height:19px;border-radius:50%;background:#8aa0b8;transition:all .25s}
 .tgl.on{background:var(--accbg);border-color:var(--accbrd)}
 .tgl.on span{left:23px;background:var(--acc)}
 .field input[type=date]{color-scheme:dark}
 body.compact .main{padding:16px 18px 40px}
 body.compact .ph h1{font-size:1.15rem}
 body.compact .acard,body.compact .icard{padding:10px 12px}
 body.compact .grid{gap:9px}
 body.compact .icard-meta{margin-top:5px}
 .stat .l{color:#8aa0b8;font-size:.66rem;letter-spacing:1px;margin-top:4px}
 /* ---------- usage ---------- */
 .usage{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
 .card{padding:22px 24px;position:relative;overflow:hidden}
 .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--glow,#4ade80),transparent);opacity:.8}
 .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
 .label{font-weight:600;font-size:.95rem;color:#c7d4e4}
 .pct{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
 .pct.ok{color:#4ade80;text-shadow:0 0 18px rgba(74,222,128,.4)}
 .pct.warn{color:#fbbf24;text-shadow:0 0 18px rgba(251,191,36,.4)}
 .pct.danger{color:#f87171;text-shadow:0 0 18px rgba(248,113,113,.45)}
 .bar{height:9px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
 .fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.22,1,.36,1)}
 .fill.ok{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 14px rgba(74,222,128,.5)}
 .fill.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24);box-shadow:0 0 14px rgba(251,191,36,.5)}
 .fill.danger{background:linear-gradient(90deg,#ef4444,#f87171);box-shadow:0 0 16px rgba(248,113,113,.6)}
 .meta{color:#8aa0b8;font-size:.76rem;margin-top:12px}
 .planchip{display:inline-block;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);color:#7dd3fc;padding:2px 12px;border-radius:99px;font-size:.68rem;margin-left:8px;vertical-align:middle;letter-spacing:1px}
 /* ---------- misc views ---------- */
 .h2{font-size:.75rem;color:#7c96b4;margin:26px 0 12px;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
 .h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(125,211,252,.35),transparent)}
 .hchip{display:flex;align-items:center;gap:10px;padding:11px 16px;text-decoration:none;color:inherit;transition:transform .25s,border-color .25s}
 .hchip:hover{transform:translateY(-3px);border-color:rgba(125,211,252,.5)}
 .hchip .hn{font-weight:650;font-size:.85rem;color:#eef4fb;display:block}
 .hchip .ht{color:#5b7189;font-size:.65rem;display:block;margin-top:2px}
 .hflex{display:flex;flex-wrap:wrap;gap:12px}
 .clock{font-size:3.4rem;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;color:#e8edf5;text-shadow:0 0 30px rgba(125,211,252,.3)}
 .greet{color:#8aa0b8;font-size:.95rem;margin-top:6px}
 .placeholder{padding:60px 30px;text-align:center;color:#5b7189}
 .placeholder .big{font-size:2.4rem;margin-bottom:12px}
 /* ---------- modal ---------- */
 .overlay{position:fixed;inset:0;z-index:40;background:rgba(4,8,18,.82);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
 .overlay.open{opacity:1;pointer-events:auto}
 .panel{width:min(480px,92vw);max-height:88vh;overflow:auto;padding:26px;transform:translateY(20px) scale(.97);transition:transform .35s cubic-bezier(.22,1,.36,1)}
 .overlay.open .panel{transform:none}
 .panel h3{margin:0 0 18px;font-size:1.05rem;letter-spacing:1px}
 .field{margin-bottom:14px}
 .field label{display:block;color:#8aa0b8;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
 .field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#e8edf5;padding:10px 12px;border-radius:11px;font-size:.88rem;outline:none;font-family:inherit}
 .field textarea{resize:vertical;min-height:90px}
 .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(125,211,252,.5)}
 .macts{display:flex;gap:10px;margin-top:20px}
 .mbtn{flex:1;padding:11px;border-radius:12px;font-size:.82rem;letter-spacing:1px;cursor:pointer;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#c7d4e4;transition:all .25s}
 .mbtn.primary{background:var(--accbg);border-color:var(--accbrd);color:var(--acc)}
 .mbtn.primary:hover{filter:brightness(1.4)}
 .mbtn.danger{border-color:rgba(248,113,113,.35);color:#f87171}
 .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:50;background:rgba(10,16,30,.95);border:1px solid rgba(125,211,252,.35);color:#c7d4e4;padding:12px 22px;border-radius:14px;font-size:.82rem;box-shadow:0 18px 50px rgba(2,8,23,.7);transition:transform .4s cubic-bezier(.22,1,.36,1);max-width:88vw}
 .toast.show{transform:translateX(-50%) translateY(0)}
 .toast.err{border-color:rgba(248,113,113,.45)}
 @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 @media (max-width:900px){
  .sidebar{transform:translateX(-105%)}
  .sidebar.open{transform:none;box-shadow:30px 0 80px rgba(2,8,23,.8)}
  .scrim.show{display:block}
  .main{margin-left:0;padding:70px 16px 50px}
  .burger{display:block}
 }
</style></head><body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<button class="burger" id="burger">☰</button>
<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar">
 <div class="brandrow"><div class="logo"><img src="logo.png" alt="IVEHUB"></div><div class="brandname">IVEHUB</div></div>
 <nav class="nav" id="nav"></nav>
 <div class="sidefoot">
  <button class="drivebtn" id="drivebtn"><span class="dot"></span><span id="drivelabel">☁ Connect Drive</span></button>
  <div class="drivemeta" id="drivemeta">local storage only</div>
 </div>
</aside>
<div class="topbar"><a class="btn" href="index.html" onclick="sessionStorage.removeItem('ivehub_auth')">LOCK ⬦</a></div>
<main class="main"><div id="view"></div></main>
<div class="overlay" id="modal"><div class="glass panel" id="modalbody"></div></div>
<div class="toast" id="toast"></div>
<script>
if (!sessionStorage.getItem('ivehub_auth')) location.href = 'index.html';

const CFG = window.IVEHUB_CONFIG || {};
const TOKEN_API = CFG.tokenApi || '';
const TOKEN_KEY = CFG.tokenKey || '';
const D = () => IVEDB.data();

/* ---------------- navigation ---------------- */
const NAV = [
 {id:'home', icon:'🏠', label:'Home', subs:[['dashboard','My Dashboard'],['quick','Quick Access'],['recent','Recently Used'],['today','Today']]},
 {id:'apps', icon:'📁', label:'Applications', subs:[['business','Business Apps'],['databases','Databases'],['personal','Personal Apps'],['development','Development Apps'],['favorites','Favorites']]},
 {id:'projects', icon:'🚀', label:'Projects', subs:[['active','Active Projects'],['completed','Completed Projects'],['history','Project History']]},
 {id:'brain', icon:'🧠', label:'My Brain', subs:[['notes','Notes'],['ideas','Ideas'],['knowledge','Knowledge'],['bookmarks','Bookmarks']]},
 {id:'tech', icon:'🖥️', label:'My Tech', subs:[['servers','Servers'],['domains','Domains'],['devices','Devices'],['tools','Tools']]},
 {id:'life', icon:'🌱', label:'My Life', subs:[['goals','Goals'],['timeline','Timeline'],['records','Personal Records']]},
 {id:'settings', icon:'⚙️', label:'Settings', subs:[['appearance','Appearance'],['dashboard','Dashboard Customization'],['appmgmt','App Management'],['backup','Backup & Sync']]}
];
const CATS = { business:'Business Apps', databases:'Databases', personal:'Personal Apps', development:'Development Apps' };

function buildNav(){
 document.getElementById('nav').innerHTML = NAV.map(s =>
  `<div class="navsec"><a href="#/${s.id}/${s.subs[0][0]}">${s.icon} ${s.label}${s.phase?` <span style="font-size:.55rem;color:#5b7189;letter-spacing:0">P${s.phase}</span>`:''}</a>
   <div class="navsub">${s.subs.map(([id,lb]) => `<a href="#/${s.id}/${id}" data-route="${s.id}/${id}">${lb}</a>`).join('')}</div></div>`
 ).join('');
}
function route(){
 const h = location.hash.replace(/^#\/?/, '') || 'home/dashboard';
 const [sec, sub] = h.split('/');
 return {sec, sub: sub || ''};
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, err){
 const t = document.getElementById('toast');
 t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
 clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), err ? 5200 : 2800);
}
function ph(title, sub, phase){ return `<div class="ph"><h1>${esc(title)}</h1><div class="sub">${esc(sub||'')}</div></div><div class="placeholder glass"><div class="big">🚧</div>Planned for Phase ${phase} — the structure is ready, this page arrives in the next build.</div>`; }
function isFav(url){ return D().favorites.indexOf(url) >= 0; }

/* ---------------- recently used (localStorage) ---------------- */
const HKEY = 'ivehub_history';
function loadH(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e){ return []; } }
function saveH(h){ try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch(e){} }
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
document.addEventListener('click', e => {
 const a = e.target.closest ? e.target.closest('a.applink') : null; if (!a) return;
 if (!a.getAttribute('href')) return;
 const card = a.closest('.acard');
 const h = loadH().filter(x => x.url !== a.href);
 h.unshift({ name: a.querySelector('.nm').textContent, icon: a.querySelector('.ico').textContent, url: a.href, ts: Date.now() });
 saveH(h.slice(0, 8));
 if (document.getElementById('recentchips')) renderRecentChips();
});
function chipHtml(a){ return `<a class="glass hchip" href="${esc(a.url)}" target="_blank" rel="noopener"><span style="font-size:1.25rem">${a.icon}</span><span><span class="hn">${esc(a.name)}</span><span class="ht">${ago(a.ts)}</span></span></a>`; }
function renderRecentChips(){ document.getElementById('recentchips').innerHTML = loadH().map(chipHtml).join('') || '<div class="empty" style="flex:1">Nothing yet — open a few apps and they will show up here.</div>'; }

/* ---------------- token usage ---------------- */
let usageTimer = null;
async function loadUsage(){
 const el = document.getElementById('usagecards'); if (!el) return;
 try {
  const r = await fetch(TOKEN_API + '/api/usage', { headers: { 'x-api-key': TOKEN_KEY } });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  const plan = document.getElementById('plan'); if (plan) plan.textContent = (d.plan||'').toUpperCase();
  el.innerHTML = '';
  for (const w of d.windows || []) {
   const p = w.percent, cls = p>=80?'danger':p>=50?'warn':'ok';
   const glow = p>=80?'#f87171':p>=50?'#fbbf24':'#4ade80';
   const label = w.type==='TOKENS_LIMIT' ? ('5-Hour Window ('+(w.hours||5)+'h)') : 'Monthly Quota';
   const reset = w.resetMs ? new Date(w.resetMs).toLocaleString('en-MY',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '?';
   el.innerHTML += `<div class="glass card" style="--glow:${glow}"><div class="row"><span class="label">${label}</span><span class="pct ${cls}">${p}%</span></div><div class="bar"><div class="fill ${cls}" style="width:${p}%"></div></div><div class="meta">resets ${reset}</div></div>`;
  }
 } catch(e) {
  el.innerHTML = `<div class="glass card" style="color:#8aa0b8">⚠ Token API unreachable${TOKEN_API===''?' (not configured in config.js)':''} — ${esc(e.message)}</div>`;
 }
}

/* ---------------- views ---------------- */
const VIEWS = {
 'home/dashboard'(){
  const sd = ((D().settings||{}).dash)||{};
  const showU = sd.usage !== false, showF = sd.favs !== false, showR = sd.recent !== false;
  const favs = favApps().slice(0,6), rec = loadH().slice(0,4);
  const hr = new Date().getHours();
  const greet = hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';

  p || {},
  vals => {
   if (!vals.title) { toast('Give the project a title', true); return false; }
   const prog = Math.max(0, Math.min(100, parseInt(vals.progress||0,10)||0));
   if (p) Object.assign(p, {title:vals.title, notes:vals.notes, progress:prog, updated:Date.now()});
   else D().projects.push({id:IVEDB.uid(), title:vals.title, notes:vals.notes, progress:prog, status:'active', updated:Date.now()});
   IVEDB.save(); render(); toast('Saved ✓');
  },
  p ? () => { if (confirm('Delete this project?')) { D().projects = D().projects.filter(x => x.id !== p.id); IVEDB.save(); closeModal(); render(); toast('Deleted'); } } : null);
}
const BRAIN_LABEL = {notes:'Note', ideas:'Idea', knowledge:'Knowledge', bookmarks:'Bookmark'};
function openBrainEditor(key, item){
 const isBm = key === 'bookmarks';
 const fields = isBm
  ? [{k:'title',label:'Title'},{k:'url',label:'URL',ph:'https://…'},{k:'desc',label:'Description'}]
  : [{k:'title',label:'Title'},{k:'body',label:'Body',type:'textarea'}].concat(key==='notes' ? [{k:'tags',label:'Tags (comma separated)',ph:'work, idea'}] : []);
 openForm((item ? 'Edit ' : 'New ') + BRAIN_LABEL[key], fields, item || {}, vals => {
  if (!vals.title) { toast('Give it a title', true); return false; }
  if (isBm) {
   if (!vals.url) { toast('Give it a URL', true); return false; }
   if (!/^https?:\/\//i.test(vals.url)) vals.url = 'https://' + vals.url;
  }
  if (item) Object.assign(item, vals, {updated: Date.now()});
  else (D().brain[key] || (D().brain[key] = [])).push(Object.assign({id: IVEDB.uid(), updated: Date.now()}, vals));
  IVEDB.save(); render(); toast('Saved ✓');
 },
 item ? () => { if (confirm('Delete this '+BRAIN_LABEL[key].toLowerCase()+'?')) { D().brain[key] = (D().brain[key]||[]).filter(x => x.id !== item.id); IVEDB.save(); closeModal(); render(); toast('Deleted'); } } : null);
}
function catOf(app){ for (const c of Object.keys(CATS)) if ((D().apps[c]||[]).some(x => x.id === app.id)) return c; return 'personal'; }
function favApps(){ const f = D().favorites; return allApps().filter(a => f.indexOf(a.url) >= 0); }
function appCard(a, cat){
 const fav = isFav(a.url);
 return `<div class="glass acard" data-id="${esc(a.id)}" data-cat="${cat}">
  <a class="applink" href="${esc(a.url)}" target="_blank" rel="noopener"><span class="ico">${a.icon||'🔗'}</span><span class="txt"><span class="nm">${esc(a.name)}</span><span class="desc">${esc(a.desc||'')}</span></span></a>
  <div class="acts">
   <button class="abtn fav${fav?' on':''}" data-act="fav" title="Favorite">★</button>
   <button class="abtn" data-act="edit" title="Edit">✎</button>
   <button class="abtn del" data-act="del" title="Remove">🗑</button>
  </div></div>`;
}

/* ---------------- app editor modal ---------------- */
let editing = null;
function openEditor(cat, app){
 editing = { cat, id: app ? app.id : null };
 const a = app || { icon:'', name:'', url:'', desc:'' };
 document.getElementById('modalbody').innerHTML = `
  <h3>${app ? 'Edit App' : 'Add App'}</h3>
  <div class="field"><label>Icon (emoji)</label><input id="f-icon" value="${esc(a.icon)}" placeholder="📊" maxlength="8"></div>
  <div class="field"><label>Name</label><input id="f-name" value="${esc(a.name)}" placeholder="App name"></div>
  <div class="field"><label>URL</label><input id="f-url" value="${esc(a.url)}" placeholder="https://…"></div>
  <div class="field"><label>Description</label><input id="f-desc" value="${esc(a.desc||'')}" placeholder="What it does"></div>
  <div class="field"><label>Category</label><select id="f-cat">${Object.entries(CATS).map(([k,v]) => `<option value="${k}"${k===cat?' selected':''}>${v}</option>`).join('')}</select></div>
  <div class="macts"><button class="mbtn" id="m-cancel">CANCEL</button><button class="mbtn primary" id="m-save">SAVE</button></div>`;
 document.getElementById('modal').classList.add('open');
 document.getElementById('m-cancel').onclick = closeModal;
 document.getElementById('m-save').onclick = saveApp;
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); editing = null; }
function saveApp(){
 const icon = document.getElementById('f-icon').value.trim() || '🔗';
 const name = document.getElementById('f-name').value.trim();
 let url = document.getElementById('f-url').value.trim();
 const desc = document.getElementById('f-desc').value.trim();
 const cat = document.getElementById('f-cat').value;
 if (!name) return toast('Give the app a name', true);
 if (!url) return toast('Give the app a URL', true);
 if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
 if (editing.id) {
  const old = allApps().find(a => a.id === editing.id);
  for (const c of Object.keys(CATS)) { const list = D().apps[c]; const i = list.findIndex(x => x.id === editing.id); if (i >= 0) list.splice(i, 1); }
  (D().apps[cat] || (D().apps[cat] = [])).push({ id: editing.id, icon, name, url, desc });
  if (old && old.url !== url) { const fi = D().favorites.indexOf(old.url); if (fi >= 0) { D().favorites.splice(fi,1); D().favorites.push(url); } }
 } else {
  (D().apps[cat] || (D().apps[cat] = [])).push({ id: IVEDB.uid(), icon, name, url, desc });
 }
 IVEDB.save(); closeModal(); render(); toast('Saved ✓');
}

/* ---------------- render + events ---------------- */
function render(){
 const {sec, sub} = route();
 document.querySelectorAll('.navsub a').forEach(a => a.classList.toggle('active', a.dataset.route === sec+'/'+sub));
 const fn = VIEWS[sec+'/'+sub];
 const view = document.getElementById('view');
 if (fn) view.innerHTML = fn(); else {
  const s = NAV.find(x => x.id === sec);
  const label = (s && s.subs.find(x => x[0]===sub) || [,''])[1];
  view.innerHTML = s ? ph(label || sec, '', s.phase || 2) : ph('Page not found', '');
 }
 if (sec==='home' && sub==='dashboard') {
  loadUsage();
  const rb = document.getElementById('refreshusage');
  if (rb) rb.onclick = () => {
   const cards = document.getElementById('usagecards');
   if (cards) cards.innerHTML = '<div class="glass card" style="color:#8aa0b8">refreshing…</div>';
   rb.style.transition = 'transform .6s ease'; rb.style.transform = 'rotate(360deg)';
   setTimeout(() => { rb.style.transition = 'none'; rb.style.transform = 'none'; }, 650);
   loadUsage();
  };
 }
 if (sec==='home' && sub==='recent') { renderRecentChips(); const c = document.getElementById('clearh'); if (c) c.onclick = () => { try{localStorage.removeItem(HKEY);}catch(e){} renderRecentChips(); toast('History cleared'); }; }
 tick();
 document.getElementById('sidebar').classList.remove('open');
 document.getElementById('scrim').classList.remove('show');
}
let clockTimer = null;
function tick(){
 clearInterval(clockTimer);
 const up = () => { const c = document.getElementById('clock'); if (!c) { clearInterval(clockTimer); return; }
  const n = new Date();
  c.textContent = n.toLocaleTimeString('en-MY',{hour12:false});
  document.getElementById('dateline').textContent = n.toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 };
 up(); clockTimer = setInterval(up, 1000);
}
document.getElementById('view').addEventListener('click', e => {
 const add = e.target.closest('[data-add]');
 if (add) return openEditor(add.dataset.add, null);
 const addp = e.target.closest('[data-addproj]');
 if (addp) return openProjectEditor(null);
 const addb = e.target.closest('[data-addbrain]');
 if (addb) return openBrainEditor(addb.dataset.addbrain, null);
 const addt = e.target.closest('[data-addtech]');
 if (addt) return openTechEditor(addt.dataset.addtech, null);
 const addl = e.target.closest('[data-addlife]');
 if (addl) return openLifeEditor(addl.dataset.addlife, null);
 const sw = e.target.closest('[data-accent]');
 if (sw) { (D().settings || (D().settings = {})).accent = sw.dataset.accent; IVEDB.save(); applySettings(); render(); toast('Accent updated ✓'); return; }
 const cmp = e.target.closest('[data-compact]');
 if (cmp) { const s = D().settings || {}; s.compact = !s.compact; D().settings = s; IVEDB.save(); applySettings(); render(); return; }
 const dtg = e.target.closest('[data-dash]');
 if (dtg) { const s = D().settings || {}; s.dash = s.dash || {}; s.dash[dtg.dataset.dash] = s.dash[dtg.dataset.dash] === false; IVEDB.save(); render(); toast('Dashboard updated ✓'); return; }
 const exp = e.target.closest('[data-export]');
 if (exp) { exportData(); return; }
 const iact = e.target.closest('.icard [data-act]');
 if (iact) {
  const card = iact.closest('.icard'), kind = card.dataset.kind, id = card.dataset.id, act = iact.dataset.act;
  if (kind === 'project') {
   const p = D().projects.find(x => x.id === id); if (!p) return;
   if (act === 'done') { p.status = 'done'; p.doneAt = Date.now(); p.progress = 100; p.updated = Date.now(); IVEDB.save(); render(); toast('Project completed ✓'); }
   else if (act === 'reopen') { p.status = 'active'; p.doneAt = null; p.updated = Date.now(); IVEDB.save(); render(); toast('Reopened'); }
   else if (act === 'edit') openProjectEditor(p);
   else if (act === 'del') { if (confirm('Delete "'+p.title+'"?')) { D().projects = D().projects.filter(x => x.id !== id); IVEDB.save(); render(); toast('Deleted'); } }
  } else if (TECH[kind]) {
   const list = D().tech[kind] || [];
   const item = list.find(x => x.id === id); if (!item) return;
   if (act === 'edit') openTechEditor(kind, item);
   else if (act === 'del') { if (confirm('Delete "'+item.name+'"?')) { D().tech[kind] = list.filter(x => x.id !== id); IVEDB.save(); render(); toast('Deleted'); } }
  } else if (kind === 'goals' || kind === 'timeline' || kind === 'records') {
   const list = D().life[kind] || [];
   const item = list.find(x => x.id === id); if (!item) return;
   if (act === 'edit') openLifeEditor(kind, item);
   else if (act === 'done' && kind === 'goals') { item.done = true; item.doneAt = Date.now(); item.progress = 100; item.updated = Date.now(); IVEDB.save(); render(); toast('Goal achieved 🎉'); }
   else if (act === 'undone' && kind === 'goals') { item.done = false; item.doneAt = null; item.updated = Date.now(); IVEDB.save(); render(); }
   else if (act === 'del') { if (confirm('Delete "'+item.title+'"?')) { D().life[kind] = list.filter(x => x.id !== id); IVEDB.save(); render(); toast('Deleted'); } }
  } else {
   const list = D().brain[kind] || [];
   const item = list.find(x => x.id === id); if (!item) return;
   if (act === 'edit') openBrainEditor(kind, item);
   else if (act === 'del') { if (confirm('Delete "'+item.title+'"?')) { D().brain[kind] = list.filter(x => x.id !== id); IVEDB.save(); render(); toast('Deleted'); } }
  }
  return;
 }
 const btn = e.target.closest('.abtn');
 if (btn) {
  const card = btn.closest('.acard');
  const id = card.dataset.id, cat = card.dataset.cat;
  const app = (D().apps[cat]||[]).find(a => a.id === id);
  if (!app) return;
  if (btn.dataset.act === 'fav') {
   const f = D().favorites, i = f.indexOf(app.url);
   if (i >= 0) f.splice(i,1); else f.push(app.url);
   IVEDB.save(); render();
  } else if (btn.dataset.act === 'edit') {
   openEditor(cat, app);
  } else if (btn.dataset.act === 'del') {
   if (!confirm('Remove "' + app.name + '" from IVEHUB?')) return;
   const list = D().apps[cat] || []; const i = list.findIndex(a => a.id === id);
   if (i >= 0) list.splice(i,1);
   const fi = D().favorites.indexOf(app.url); if (fi >= 0) D().favorites.splice(fi,1);
   IVEDB.save(); render(); toast('Removed');
  }
  return;
 }
 if (e.target.id === 'modal') closeModal();
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.getElementById('view').addEventListener('change', e => {
 if (e.target.id !== 'impfile') return;
 const f = e.target.files[0]; if (!f) return;
 const r = new FileReader();
 r.onload = () => {
  try {
   const d = JSON.parse(r.result);
   if (!d || typeof d !== 'object') throw new Error('not an IVEHUB backup');
   if (!confirm('Replace ALL current data with this backup?')) return;
   IVEDB.replace(d); applySettings(); render(); toast('Backup restored ✓');
  } catch (err) { toast('Import failed: ' + err.message, true); }
 };
 r.readAsText(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('view').addEventListener('input', e => {
 if (e.target.id !== 'appsearch') return;
 const q = e.target.value.toLowerCase();
 document.querySelectorAll('#appgrid .acard, #appgrid .icard').forEach(c => {
  const t = c.textContent.toLowerCase();
  c.style.display = t.indexOf(q) >= 0 ? '' : 'none';
 });
});

/* ---------------- Google Drive ---------------- */
function driveUi(){
 const s = IVEDB.status();
 const btn = document.getElementById('drivebtn');
 btn.classList.toggle('on', s.connected);
 document.getElementById('drivelabel').textContent = s.connected ? 'Drive synced' : '☁ Connect Drive';
 document.getElementById('drivemeta').textContent = s.connected
  ? ('last sync ' + (s.lastSync ? new Date(s.lastSync).toLocaleTimeString('en-MY') : '…'))
  : (s.clientIdSet ? 'tap to sync via Google Drive' : 'local storage only — set google.clientId (README)');
}
document.getElementById('drivebtn').onclick = async () => {
 const s = IVEDB.status();
 if (s.connected) {
  if (confirm('Disconnect Google Drive? Data stays on this device (localStorage); Drive keeps its copy.')) { IVEDB.disconnect(); driveUi(); toast('Drive disconnected'); }
  return;
 }
 try { await IVEDB.connect(); driveUi(); toast('Google Drive connected ✓ — data now syncs'); }
 catch (err) { toast('Drive connect failed: ' + err.message, true); }
};
IVEDB.onChange(driveUi);

/* ---------------- mobile + boot ---------------- */
document.getElementById('burger').onclick = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); };
document.getElementById('scrim').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); };
window.addEventListener('hashchange', render);
buildNav();
applySettings();
driveUi();
render();
</script></body></html>
